[project]
name = "maestro-agent"
version = "0.1.0"
description = "Maestro music-coach agent — local dev service for WereCode (ported from the modal_apis/Maestro POC)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "mido>=1.3.3",
    "supabase>=2.6.0",
    # Agent stack: DeepAgents for orchestration; LiteLLM (via langchain-litellm)
    # as the single LLM client for token/cost tracking + provider switching.
    "deepagents>=0.6.10",
    "litellm>=1.40",
    "langchain-litellm>=0.1.4",
]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maestro_agent"]
